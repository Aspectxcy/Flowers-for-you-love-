<!DOCTYPE html>
<html lang="en" data-style="garden">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>My Arshiya · Eternal Bloom</title>
  <meta name="description" content="An interactive botanical conservatory of eternal red roses, white and pink lilies, and pink tulips." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌹</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #170910;
      --sky-top: #14070D;
      --sky-mid: #2C101E;
      --sky-bot: #471A2F;
      --cream: #FFF7FA;
      --accent: #F497B6;
      --card-bg: rgba(26, 9, 18, .74);
      --card-border: rgba(244, 151, 182, .34);
      --veil: 23, 9, 16;
      --edge: 12, 3, 8;
      --edge-a: .62;
      --halo: radial-gradient(closest-side, rgba(244, 151, 182, .30), rgba(186, 56, 102, .14) 50%, transparent 78%);
      --serif: "Cormorant Garamond", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --back: cubic-bezier(.34, 1.56, .64, 1);
    }
    [data-style="paper"] {
      --ink: #FBF4EE; --sky-top: #F7EAE0; --sky-mid: #FBF4EE; --sky-bot: #F0DEC8;
      --cream: #2B1620; --accent: #B8335E; --card-bg: rgba(255, 250, 246, .84); --card-border: rgba(184, 51, 94, .28);
      --veil: 251, 244, 238; --edge: 140, 100, 96; --edge-a: .28;
      --halo: radial-gradient(closest-side, rgba(244, 151, 182, .35), rgba(255, 224, 214, .45) 48%, transparent 76%);
    }
    [data-style="sunset"] {
      --ink: #220C18; --sky-top: #1E0A16; --sky-mid: #4A1934; --sky-bot: #852E58;
      --cream: #FFF5F8; --accent: #FF9EBB; --card-bg: rgba(34, 12, 24, .74); --card-border: rgba(255, 158, 187, .36);
      --veil: 34, 12, 24; --edge: 16, 4, 10; --edge-a: .58;
      --halo: radial-gradient(closest-side, rgba(255, 158, 187, .35), rgba(232, 95, 145, .16) 50%, transparent 78%);
    }
    [data-style="aurora"] {
      --ink: #13091E; --sky-top: #0E0618; --sky-mid: #231238; --sky-bot: #3E1E5A;
      --cream: #FAF2FF; --accent: #F497B6; --card-bg: rgba(20, 10, 32, .74); --card-border: rgba(244, 151, 182, .34);
      --veil: 19, 9, 30; --edge: 8, 4, 16; --edge-a: .64;
      --halo: radial-gradient(closest-side, rgba(244, 151, 182, .26), rgba(168, 130, 255, .14) 50%, transparent 76%);
    }
    [data-style="blueprint"] {
      --ink: #1F0A14; --sky-top: #16060E; --sky-mid: #280D1B; --sky-bot: #3A1328;
      --cream: #FFE6F0; --accent: #F497B6; --card-bg: rgba(28, 8, 18, .78); --card-border: rgba(244, 151, 182, .40);
      --veil: 31, 10, 20; --edge: 12, 3, 8; --edge-a: .70;
      --halo: radial-gradient(closest-side, rgba(244, 151, 182, .22), rgba(255, 143, 176, .08) 48%, transparent 74%);
    }
    [data-style="code"] {
      --ink: #0D060A; --sky-top: #080306; --sky-mid: #140810; --sky-bot: #220D1A;
      --cream: #FFE8F0; --accent: #FF8FB3; --card-bg: rgba(16, 6, 12, .80); --card-border: rgba(255, 143, 179, .38);
      --veil: 13, 6, 10; --edge: 5, 2, 4; --edge-a: .72;
      --halo: radial-gradient(closest-side, rgba(255, 143, 179, .22), rgba(244, 151, 182, .08) 48%, transparent 74%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--ink); color: var(--cream); overflow: hidden; font-family: var(--serif); -webkit-font-smoothing: antialiased; }
    #stage {
      position: fixed; inset: 0; height: 100dvh; overflow: hidden; cursor: pointer;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 56%, var(--sky-bot) 100%);
    }
    #halo {
      position: absolute; left: 50%; top: 56%; width: min(150vw, 1250px); aspect-ratio: 1/.9;
      transform: translate(-50%, -50%); background: var(--halo); opacity: 0;
      animation: fade 2.2s var(--ease) .2s forwards; pointer-events: none;
    }
    @keyframes fade { to { opacity: 1; } }
    #vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(closest-side at 50% 58%, transparent 52%, rgba(var(--edge), var(--edge-a)) 100%);
    }
    #scene {
      position: absolute; inset: 0; transform: scale(1.04);
      animation: pullback 10s cubic-bezier(.4, 0, .2, 1) .1s forwards;
    }
    @keyframes pullback { to { transform: scale(1); } }
    #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .stem {
      fill: none; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100;
      animation: grow 1.5s var(--ease) forwards; animation-delay: var(--s);
    }
    @keyframes grow { to { stroke-dashoffset: 0; } }
    .leaf {
      fill: url(#gLeaf); transform-box: fill-box; transform-origin: 0% 50%;
      transform: scale(.02, .35); opacity: 0;
      animation: leafOpen .6s var(--back) forwards; animation-delay: calc(var(--s) + .55s + var(--k) * .14s);
    }
    @keyframes leafOpen { to { transform: scale(1, 1); opacity: 1; } }
    .blade {
      fill: url(#gLeaf); transform-box: fill-box; transform-origin: 50% 100%;
      transform: scaleY(.05); opacity: 0; animation: bladeUp .9s var(--ease) forwards; animation-delay: var(--s);
    }
    @keyframes bladeUp { to { transform: scaleY(1); opacity: 1; } }
    .petal {
      transform-box: fill-box; transform-origin: 50% 100%;
      transform: scale(.07, .2) rotate(-26deg); opacity: 0;
      animation: petalOpen .95s var(--ease) forwards; animation-delay: calc(var(--b) + var(--j) * .042s);
    }
    @keyframes petalOpen {
      0% { transform: scale(.07, .2) rotate(-26deg); opacity: 0; }
      40% { opacity: 1; }
      72% { transform: scale(1.06, 1.03) rotate(2.5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .swirl {
      transform-box: fill-box; transform-origin: 50% 100%;
      transform: scale(.1) rotate(-46deg); opacity: 0;
      animation: swirlIn .75s var(--back) forwards; animation-delay: calc(var(--b) + .34s + var(--j) * .05s);
    }
    @keyframes swirlIn { to { transform: scale(1) rotate(0deg); opacity: 1; } }
    .sepal {
      transform-box: fill-box; transform-origin: 50% 100%;
      transform: scaleY(.06); opacity: 0;
      animation: sepalUp .7s var(--ease) forwards; animation-delay: calc(var(--b) - .18s);
    }
    @keyframes sepalUp { to { transform: scaleY(1); opacity: .95; } }
    .thorn, .bud, .core {
      transform-box: fill-box; transform-origin: 50% 50%;
      transform: scale(0); opacity: 0; animation: coreIn .5s var(--back) forwards; animation-delay: calc(var(--b) + .25s);
    }
    @keyframes coreIn { to { transform: scale(1); opacity: 1; } }
    .layer-sway {
      transform-origin: 50% 100%;
      animation: layerSway 9s ease-in-out 3.5s infinite;
      will-change: transform;
    }
    @keyframes layerSway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(.65deg) translate3d(2px,0,0); } }
    .bloom { transform-box: fill-box; transform-origin: 50% 100%; }
    .bloom.pop { animation: pop .65s var(--back); }
    @keyframes pop { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.15); } }
    .spark {
      fill: var(--accent); opacity: 0;
      animation: spark 8s ease-in-out infinite;
    }
    @keyframes spark {
      0% { opacity: 0; transform: translateY(6px); }
      25% { opacity: .85; }
      65% { opacity: .5; }
      100% { opacity: 0; transform: translateY(-36px); }
    }
    #fall { position: absolute; inset: 0; pointer-events: none; overflow: hidden; contain: strict; }
    .fp { position: absolute; border-radius: 60% 8% 60% 8%; pointer-events: none; will-change: transform, opacity; contain: layout style paint; }
    #msg {
      position: absolute; left: 0; right: 0; top: 44%; transform: translateY(-50%);
      padding: 0 5vw; display: flex; justify-content: center; pointer-events: none; z-index: 4;
    }
    #keepsake {
      position: relative; width: 100%; max-width: 540px; padding: 26px 28px 22px; text-align: center;
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, .42), inset 0 0 0 1px rgba(255, 255, 255, .06);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      opacity: 0; pointer-events: none; transform: translateY(14px);
      animation: rise 1.25s var(--ease) 5.2s forwards;
    }
    #keepsake::before {
      content: ""; position: absolute; inset: 7px; border: 1px solid var(--card-border);
      border-radius: 14px; opacity: .45; pointer-events: none;
    }
    .rise {
      opacity: 0; pointer-events: none; transform: translateY(14px);
      animation: rise 1.25s var(--ease) var(--d, 5.4s) forwards;
    }
    @keyframes rise {
      0% { opacity: 0; pointer-events: none; transform: translateY(14px); }
      100% { opacity: 1; pointer-events: auto; transform: translateY(0); }
    }
    #spec { font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; opacity: .72; margin-bottom: 10px; }
    #eyebrow { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--accent); margin-bottom: .6em; }
    #to {
      display: block; font-weight: 400; font-style: italic; font-size: clamp(32px, 7.5vw, 56px);
      line-height: 1.06; letter-spacing: -.01em; color: var(--cream);
    }
    .div { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px auto 14px; width: 150px; color: var(--accent); opacity: .8; font-size: 13px; }
    .div::before, .div::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
    #ded { max-width: 38ch; margin: 0 auto; font-size: clamp(16px, 4.2vw, 21px); font-weight: 300; font-style: italic; line-height: 1.58; color: var(--cream); opacity: .94; }
    #ded .ln { display: block; }
    #from { display: block; margin-top: 1.2em; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
    .card-actions { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(244,151,182,.2); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; font-family: system-ui, sans-serif; }
    .cbtn {
      font-size: 11px; font-weight: 500; padding: 7px 14px; border-radius: 9px; border: 1px solid rgba(244,151,182,.35);
      background: rgba(255,255,255,.08); color: var(--cream); cursor: pointer; transition: all .2s ease;
    }
    .cbtn.pri { background: #F497B6; color: #170910; border-color: #F497B6; font-weight: 600; }
    #fab-bar {
      position: fixed; right: 16px; bottom: 16px; z-index: 6; display: flex; gap: 8px;
    }
    .fab {
      font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600;
      color: var(--cream); background: rgba(var(--veil), .78);
      border: 1px solid rgba(244, 151, 182, .45); border-radius: 12px; padding: 10px 15px; cursor: pointer;
      backdrop-filter: blur(10px); transition: all .25s ease;
    }
    .fab.pri { background: #F497B6; color: #170910; border-color: #F497B6; }
    #sheet {
      position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center;
      background: rgba(0,0,0,.62); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .28s ease;
    }
    #sheet.open { opacity: 1; pointer-events: auto; }
    #card {
      width: 100%; max-width: 520px; max-height: 88dvh; overflow-y: auto; background: #1A0912; color: #FFF7FA;
      border-top: 1px solid rgba(244,151,182,.3); border-radius: 20px 20px 0 0; padding: 22px 20px 26px; font-family: system-ui, sans-serif;
    }
    #card h2 { font-family: var(--serif); font-size: 24px; font-weight: 400; font-style: italic; margin-bottom: 4px; }
    .lbl { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,247,250,.7); margin: 12px 0 5px; }
    .inp, .ta, .sel {
      width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); border-radius: 10px;
      color: #FFF7FA; padding: 9px 12px; font-size: 14px; outline: none;
    }
    .inp:focus, .ta:focus, .sel:focus { border-color: #F497B6; }
    .sel option { background: #1A0912; color: #FFF7FA; }
    .btns { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }
    .btn {
      font-family: system-ui, sans-serif; font-size: 12px; font-weight: 500;
      padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08);
      color: #FFF7FA; cursor: pointer;
    }
    .btn.pri { background: #F497B6; color: #170910; border-color: #F497B6; font-weight: 600; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="halo"></div>
    <div id="scene">
      <svg id="field" preserveAspectRatio="xMidYMid slice" aria-label="A garden of red roses, white and pink lilies, and pink tulips">
        <defs>
          <radialGradient id="gMoonHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFE5EE" stop-opacity="0.45" />
            <stop offset="45%" stop-color="#F497B6" stop-opacity="0.16" />
            <stop offset="100%" stop-color="#170910" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="gSunsetOrb" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFB3C6" stop-opacity="0.52" />
            <stop offset="48%" stop-color="#D84A7A" stop-opacity="0.22" />
            <stop offset="100%" stop-color="#2C101E" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="gAuroraEmerald" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3DDE84" stop-opacity="0" />

          </linearGradient>
          <linearGradient id="gAuroraViolet" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#9D65FF" stop-opacity="0" />
            <stop offset="50%" stop-color="#C89CF5" stop-opacity="0.65" />
            <stop offset="100%" stop-color="#9D65FF" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="gStem" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#1B3E2B" />
            <stop offset="55%" stop-color="#36694B" />
            <stop offset="100%" stop-color="#568E6B" />
          </linearGradient>
          <linearGradient id="gStemDark" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#0F261A" />
            <stop offset="100%" stop-color="#264C35" />
          </linearGradient>
          <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#244E37" />
            <stop offset="55%" stop-color="#3F7856" />
            <stop offset="100%" stop-color="#6CA680" />
          </linearGradient>
          <radialGradient id="gRedRoseOuter" cx="50%" cy="90%" r="86%">
            <stop offset="0%" stop-color="#380108" />
            <stop offset="48%" stop-color="#9B081E" />
            <stop offset="86%" stop-color="#D91432" />
            <stop offset="100%" stop-color="#FF4764" />
          </radialGradient>
          <radialGradient id="gRedRoseMid" cx="50%" cy="90%" r="86%">
            <stop offset="0%" stop-color="#4A020C" />
            <stop offset="45%" stop-color="#B80D27" />
            <stop offset="85%" stop-color="#EB1E3E" />
            <stop offset="100%" stop-color="#FF6B82" />
          </radialGradient>
          <radialGradient id="gRedRoseInner" cx="50%" cy="88%" r="84%">
            <stop offset="0%" stop-color="#5E0411" />
            <stop offset="50%" stop-color="#CE122E" />
            <stop offset="100%" stop-color="#FF7A8E" />
          </radialGradient>
          <radialGradient id="gRedRoseCore" cx="50%" cy="85%" r="82%">
            <stop offset="0%" stop-color="#2B0106" />
            <stop offset="60%" stop-color="#8F071C" />
            <stop offset="100%" stop-color="#E01A38" />
          </radialGradient>
          <radialGradient id="gLilyOuter" cx="50%" cy="92%" r="88%">
            <stop offset="0%" stop-color="#CEDEC0" />
            <stop offset="28%" stop-color="#F2F1E8" />
            <stop offset="72%" stop-color="#FCFBF9" />
            <stop offset="100%" stop-color="#FFFFFF" />
          </radialGradient>
          <radialGradient id="gLilyInner" cx="50%" cy="92%" r="88%">
            <stop offset="0%" stop-color="#D8E8C8" />
            <stop offset="24%" stop-color="#F8F7F2" />
            <stop offset="68%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#FFFFFF" />
          </radialGradient>
          <radialGradient id="gLilyThroat" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#88B052" />
            <stop offset="60%" stop-color="#D6E6BC" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="gPinkLilyOuter" cx="50%" cy="92%" r="88%">
            <stop offset="0%" stop-color="#A81D4E" />
            <stop offset="38%" stop-color="#E65C8C" />
            <stop offset="78%" stop-color="#F9ACC6" />
            <stop offset="100%" stop-color="#FFF0F5" />
          </radialGradient>
          <radialGradient id="gPinkLilyInner" cx="50%" cy="92%" r="88%">
            <stop offset="0%" stop-color="#941442" />
            <stop offset="36%" stop-color="#DE4B7E" />
            <stop offset="76%" stop-color="#F79EC0" />
            <stop offset="100%" stop-color="#FFF5F8" />
          </radialGradient>
          <radialGradient id="gPinkLilyThroat" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#7A0B32" />
            <stop offset="60%" stop-color="#D84A7A" />
            <stop offset="100%" stop-color="#FFF0F5" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="gTulipPink" cx="50%" cy="92%" r="86%">
            <stop offset="0%" stop-color="#9E3858" />

          </radialGradient>
          <radialGradient id="gTulipPinkDeep" cx="50%" cy="92%" r="86%">
            <stop offset="0%" stop-color="#6E1E38" />

          </radialGradient>
          <radialGradient id="gTulipMagenta" cx="50%" cy="92%" r="86%">
            <stop offset="0%" stop-color="#64142E" />
            <stop offset="48%" stop-color="#BD3B62" />
            <stop offset="88%" stop-color="#ED82A0" />

          </radialGradient>
          <radialGradient id="gTulipWine" cx="50%" cy="92%" r="86%">
            <stop offset="0%" stop-color="#3B0819" />

          </radialGradient>
          <radialGradient id="gTulipBlush" cx="50%" cy="92%" r="86%">

            <stop offset="88%" stop-color="#FFC2D6" />

          </radialGradient>
          <radialGradient id="gTulipBlushDeep" cx="50%" cy="92%" r="86%">
            <stop offset="0%" stop-color="#822044" />
            <stop offset="55%" stop-color="#D45680" />
            <stop offset="100%" stop-color="#FF9EBC" />
          </radialGradient>
          <radialGradient id="gTulipLavender" cx="50%" cy="92%" r="86%">
            <stop offset="0%" stop-color="#522B78" />
            <stop offset="48%" stop-color="#9C6ADE" />
            <stop offset="88%" stop-color="#D4B8FF" />

          </radialGradient>
          <radialGradient id="gTulipPlumDeep" cx="50%" cy="92%" r="86%">
            <stop offset="0%" stop-color="#341652" />
            <stop offset="55%" stop-color="#7242B0" />

        </defs>
        <g id="sky"></g>
        <g id="back"></g>
        <g id="mid"></g>
        <g id="turf"></g>
        <g id="front"></g>
        <g id="sparks"></g>
      </svg>
    </div>
    <div id="vignette"></div>
    <div id="fall"></div>
    <div id="msg">
      <div id="keepsake" onclick="event.stopPropagation()">
        <div id="spec" class="rise" style="--d: 5.35s">24 Red Roses · 18 White &amp; Pink Lilies · 30 Pink Tulips</div>
        <div id="eyebrow" class="rise" style="--d: 5.55s"></div>
        <span id="to" class="rise" style="--d: 5.8s"></span>
        <div class="div rise" style="--d: 6.0s"><span>❦</span></div>
        <div id="ded"></div>
        <span id="from" class="rise"></span>
        <div class="card-actions rise" id="c-actions">

  <script>

      function rosePetalD(w, h, cup, ruffle) {

          " C" + f(-w * .03) + "," + f(-h * .90) + " " + f(w * .03) + "," + f(-h * .90) + " " + f(w * .10) + "," + f(-h * .95) +
          " C" + f(w * .36) + "," + f(-h * 1.05 + rf) + " " + f(w * .74 * c) + "," + f(-h * .96 - rf) + " " + f(w * .88 * c) + "," + f(-h * .76) +

          " C" + f(-bw * .56) + "," + f(-h * .91) + " " + f(-bw * .18) + "," + f(-h * .99) + " 0," + f(-h * 1.06) +
          " C" + f(bw * .18) + "," + f(-h * .99) + " " + f(bw * .56) + "," + f(-h * .91) + " " + f(bw * .78) + "," + f(-h * .74) +
          " C" + f(bw * .98) + "," + f(-h * .42) + " " + f(bw * .34) + "," + f(-h * .14) + " 0,0 Z";
      }

      function petal(d, rot, rad, fill, j, op, strokeColor) {

        wrap.appendChild(p);
        return wrap;
      }

      function redRose(g, detail) {
        var i, n, j = 0;
        if (detail > 0)
          for (i = 0; i < 5; i++) {
            var sw = el("g", { transform: "rotate(" + (i * 72 + 36 + jit(8)).toFixed(1) + ")" });
            sw.appendChild(el("path", { d: "M0,0 C-4.2,-11 -2.8,-26 0,-39 C2.8,-26 4.2,-11 0,0 Z", fill: WIRE ? "none" : "url(#gLeaf)", "class": "sepal" }));
            g.appendChild(sw);
          }
        n = detail > 1 ? 9 : 7;
        for (i = 0; i < n; i++, j++) g.appendChild(petal(rosePetalD(22 + jit(1.6), 38 + jit(2.6), 1.12, jit(1)), i * (360 / n) + jit(6), 3.5, "url(#gRedRoseOuter)", j, .99));
        n = detail > 1 ? 8 : 6;
        for (i = 0; i < n; i++, j++) g.appendChild(petal(rosePetalD(17.5 + jit(1.3), 29 + jit(2), .96, jit(.8)), 24 + i * (360 / n) + jit(6), 2.4, "url(#gRedRoseMid)", j, .99));
        if (detail > 0) {
          n = 6;
          for (i = 0; i < n; i++, j++) g.appendChild(petal(rosePetalD(13 + jit(.9), 21 + jit(1.5), .82, jit(.5)), 12 + i * (360 / n) + jit(7), 1.4, "url(#gRedRoseInner)", j, .99));
        }
        if (!WIRE) g.appendChild(el("ellipse", { cx: 0, cy: -4.5, rx: 10.5, ry: 9, fill: "rgba(32,2,8,.58)", "class": "core" }));
        var sn = detail > 1 ? 9 : 6;
        for (i = 0; i < sn; i++) {
          var t = i / (sn - 1);
          var wrap = el("g", { transform: "rotate(" + (i * 137.5 + jit(6)).toFixed(1) + ") translate(0," + (-(8.2 - t * 6.2)).toFixed(1) + ") scale(" + (1 - t * .58).toFixed(2) + ")" });
          var sp = el("path", { d: "M-7.5,0 C-9.5,-6.5 -4.5,-13.5 0,-14.2 C4.5,-13.5 9.5,-6.5 7.5,0 C3.8,-4.8 -3.8,-4.8 -7.5,0 Z", fill: WIRE ? "none" : (i % 2 === 0 ? "url(#gRedRoseInner)" : "url(#gRedRoseCore)"), stroke: "rgba(255,160,175,.28)", "stroke-width": .65, "class": "swirl" });
          sp.style.setProperty("--j", j + i);
          wrap.appendChild(sp);
          g.appendChild(wrap);
        }
      }

      function lily(g, detail, isPink) {
        var i, j = 0, f = function (n) { return n.toFixed(2); };
        var oFill = isPink ? "url(#gPinkLilyOuter)" : "url(#gLilyOuter)";
        var iFill = isPink ? "url(#gPinkLilyInner)" : "url(#gLilyInner)";
        var tFill = isPink ? "url(#gPinkLilyThroat)" : "url(#gLilyThroat)";
        var st = isPink ? "rgba(255,215,230,.55)" : "rgba(195,202,182,.45)";
        for (i = 0; i < 3; i++, j++) g.appendChild(petal(lilyTepalD(13.5 + jit(.9), 44 + jit(2.4), false), i * 120 + jit(4), 1.8, oFill, j, .97, st));
        for (i = 0; i < 3; i++, j++) g.appendChild(petal(lilyTepalD(15 + jit(1.0), 41 + jit(2.2), true), 60 + i * 120 + jit(4), 1.2, iFill, j, 1, st));
        if (!WIRE) g.appendChild(el("circle", { cx: 0, cy: 0, r: 6.2, fill: tFill, "class": "core" }));
        var ns = detail > 0 ? 6 : 4;
        for (i = 0; i < ns; i++) {
          var a = (i * (360 / ns) + 18 + jit(7)) * (Math.PI / 180), len = 17 + rnd() * 5.5;
          var tx = Math.cos(a) * len, ty = Math.sin(a) * len - 3.5;
          var stG = el("g", { "class": "swirl" }); stG.style.setProperty("--j", j + i);
          stG.appendChild(el("path", { d: "M0,0 Q" + f(tx * .55) + "," + f(ty * .55 - 4) + " " + f(tx) + "," + f(ty), fill: "none", stroke: isPink ? "#FFD6E5" : "#E6F0D5", "stroke-width": 1 }));
          stG.appendChild(el("ellipse", { cx: f(tx), cy: f(ty), rx: 3.1, ry: 1.35, fill: "#B8335E", stroke: "#F497B6", "stroke-width": .45 }));
          g.appendChild(stG);
        }
      }

      function tulip(g, pair, detail) {
        var j = 0, f = function (n) { return n.toFixed(2); }, w = 18.5 + jit(1.4), h = 38 + jit(2.6);
        if (detail > 0) {
          [-12, 0, 12].forEach(function (ro, idx) {
            var bd = "M0,0 C" + f(-w * .46) + "," + f(-h * .18) + " " + f(-w * .54) + "," + f(-h * .76) + " " + f(-w * .06) + "," + f(-h * (idx === 1 ? 1.06 : 1.02)) + " C" + f(w * .06) + "," + f(-h * (idx === 1 ? 1.06 : 1.02)) + " " + f(w * .54) + "," + f(-h * .76) + " 0,0 Z";
            g.appendChild(petal(bd, ro + jit(1.8), 2.5, pair.inner, j++, .92));
          });
        }
        [-1, 1].forEach(function (side) {
          var sd = "M0,1 C" + f(side * w * .88) + "," + f(-h * .05) + " " + f(side * w * 1.14) + "," + f(-h * .54) + " " + f(side * w * .68) + "," + f(-h * .94) + " C" + f(side * w * .42) + "," + f(-h * 1.05) + " " + f(side * w * .10) + "," + f(-h * .97) + " " + f(side * w * .02) + "," + f(-h * .84) + " Z";
          g.appendChild(petal(sd, side * 5.5, 0, pair.outer, j++, .97));
        });
        var cd = "M0,2.2 C" + f(-w * .7) + "," + f(-h * .04) + " " + f(-w * .78) + "," + f(-h * .58) + " " + f(-w * .34) + "," + f(-h * .94) + " C" + f(-w * .12) + "," + f(-h * 1.03) + " " + f(w * .12) + "," + f(-h * 1.03) + " " + f(w * .34) + "," + f(-h * .94) + " C" + f(w * .78) + "," + f(-h * .58) + " " + f(w * .7) + "," + f(-h * .04) + " 0,2.2 Z";
        g.appendChild(petal(cd, jit(1.2), 0, pair.outer, j++, 1));
      }

      var TULIP_PAIRS = [
        { outer: "url(#gTulipPink)", inner: "url(#gTulipPinkDeep)" },
        { outer: "url(#gTulipMagenta)", inner: "url(#gTulipWine)" },
        { outer: "url(#gTulipBlush)", inner: "url(#gTulipBlushDeep)" },
        { outer: "url(#gTulipLavender)", inner: "url(#gTulipPlumDeep)" }
      ];

      var LAYERS = [
        { id: "back", roses: 8, whiteLilies: 3, pinkLilies: 3, tulips: 12, y0: 55, y1: 350, s0: .28, s1: .44, det: 0, stem: "url(#gStemDark)", base: .15, span: .85, leaves: 1, op: .64 },
        { id: "mid", roses: 8, whiteLilies: 3, pinkLilies: 3, tulips: 10, y0: 225, y1: 535, s0: .52, s1: .76, det: 1, stem: "url(#gStem)", base: .65, span: .95, leaves: 2, op: .94 },
        { id: "front", roses: 8, whiteLilies: 3, pinkLilies: 3, tulips: 8, y0: 425, y1: 800, s0: .90, s1: 1.32, det: 2, stem: "url(#gStem)", base: 1.15, span: 1.05, leaves: 3, op: 1 }
      ];

      function bez(p0, p1, p2, p3, t) {
        var u = 1 - t;
        return { x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x, y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y };
      }
      function bezTan(p0, p1, p2, p3, t) {
        var u = 1 - t;
        return { x: 3*u*u*(p1.x-p0.x) + 6*u*t*(p2.x-p1.x) + 3*t*t*(p3.x-p2.x), y: 3*u*u*(p1.y-p0.y) + 6*u*t*(p2.y-p1.y) + 3*t*t*(p3.y-p2.y) };
      }

      var roses = 0, lilies = 0, tulips = 0;
      LAYERS.forEach(function (L) {
        var host = document.getElementById(L.id);
        host.setAttribute("opacity", L.op);
        var layerSway = el("g", { "class": "layer-sway" });
        var frag = document.createDocumentFragment();
        var pool = [];
        var r;

        for (r = 0; r < L.pinkLilies; r++) pool.push("pinkLily");
        for (r = 0; r < L.tulips; r++) pool.push("tulip");
        for (r = pool.length - 1; r > 0; r--) {

            x: -25 + t * (VB_W + 50) + jit(VB_W / n * .42),
            y: sp === "redRose" ? L.y0 + (y - L.y0) * .65 : y,

          var sDelay = L.base + (idx / n) * L.span + rnd() * .3, bDelay = sDelay + .95 + rnd() * .2;

          var spots = [[.34], [.32, .62], [.24, .48, .7]][L.leaves - 1];
          spots.forEach(function (tt, k) {
            var pt = bez(p0, p1, p2, p3, tt), tan = bezTan(p0, p1, p2, p3, tt), ang = Math.atan2(tan.y, tan.x) * 180 / Math.PI, side = k % 2 === 0 ? -1 : 1;
            var wrap = el("g", { transform: "translate(" + pt.x.toFixed(1) + "," + pt.y.toFixed(1) + ") rotate(" + (ang + side * 38).toFixed(1) + ") scale(" + (f.s * (1 - k * .15)).toFixed(2) + ")" });
            var lf = el("path", { d: f.species === "redRose" ? "M0,0 C11,-9 30,-8 44,0 C30,9 11,10 0,0 Z" : "M0,0 C10,-9 36,-12 68,-2 C36,7 12,9 0,0 Z", "class": "leaf" });
            lf.style.setProperty("--k", k); wrap.appendChild(lf); stalk.appendChild(wrap);
          });
          var head = el("g", { transform: "translate(" + f.x.toFixed(1) + "," + f.y.toFixed(1) + ") rotate(" + f.r.toFixed(1) + ") scale(" + f.s.toFixed(2) + ")" });
          var bloom = el("g", { "class": "bloom" });
          if (f.species === "redRose") { redRose(bloom, L.det); roses++; }
          else if (f.species === "whiteLily") { lily(bloom, L.det, false); lilies++; }
          else if (f.species === "pinkLily") { lily(bloom, L.det, true); lilies++; }
          else { tulip(bloom, pick(TULIP_PAIRS), L.det); tulips++; }

        });
        layerSway.appendChild(frag);

      });

      var turf = document.getElementById("turf"), nTuft = Math.round(28 * K);
      for (var t2 = 0; t2 < nTuft; t2++) {
        var tx = -30 + ((t2 + .5) / nTuft) * (VB_W + 60) + jit(VB_W / nTuft * .5);
        var tuft = el("g", { transform: "translate(" + tx.toFixed(1) + "," + GROUND + ")" }); tuft.style.setProperty("--s", (2.4 + rnd() * 2.4).toFixed(2) + "s");

          var g2 = el("g", { transform: "rotate(" + jit(46).toFixed(1) + ") scale(" + (.55 + rnd() * .75).toFixed(2) + "," + (.8 + rnd() * .7).toFixed(2) + ")" });
          g2.appendChild(el("path", { d: "M0,0 C-7,-46 -5,-92 0,-124 C6,-92 9,-46 0,0 Z", "class": "blade" }));
          tuft.appendChild(g2);
        }
        turf.appendChild(tuft);
      }

      var sparks = document.getElementById("sparks");
      for (var s2 = 0; s2 < 32; s2++) {
        var c = el("circle", { cx: (rnd() * VB_W).toFixed(1), cy: (50 + rnd() * 640).toFixed(1), r: (.9 + rnd() * 1.9).toFixed(2), "class": "spark" });
        c.style.animationDelay = (1.5 + rnd() * 6).toFixed(2) + "s"; sparks.appendChild(c);
      }

      function fill(t) { return t.split("{n}").join(roses).split("{l}").join(lilies).split("{s}").join(tulips); }
      var rawTo = qs.get("to") !== null ? qs.get("to") : (saved.to !== undefined ? saved.to : DEFAULT_TO);
      var rawOcc = qs.get("occasion") !== null ? qs.get("occasion") : (saved.occasion !== undefined ? saved.occasion : DEFAULT_OCCASION);
      var rawFrom = qs.get("from") !== null ? qs.get("from") : (saved.from !== undefined ? saved.from : DEFAULT_FROM);
      var rawMsg = qs.get("msg") !== null ? qs.get("msg") : (saved.msg !== undefined ? saved.msg.split("\n").join("|") : DEFAULT_MSG);

      function renderCard(toVal, occVal, fromVal, msgVal) {
        document.getElementById("eyebrow").textContent = fill(occVal || DEFAULT_OCCASION);
        document.getElementById("to").textContent = fill(toVal || DEFAULT_TO);
        var ded = document.getElementById("ded");
        ded.innerHTML = "";
        var lines = fill(msgVal || DEFAULT_MSG).split("|").slice(0, 5);
        lines.forEach(function (line, idx) {
          var sp = document.createElement("span");
          sp.className = "ln rise";
          sp.style.setProperty("--d", (6.2 + idx * .38).toFixed(2) + "s");
          sp.textContent = line.trim();
          ded.appendChild(sp);
        });
        var fromEl = document.getElementById("from");
        var fTxt = fill(fromVal || "");
        fromEl.textContent = fTxt ? "— " + fTxt : "";
        fromEl.style.setProperty("--d", (6.4 + lines.length * .38).toFixed(2) + "s");
        document.getElementById("c-actions").style.setProperty("--d", (6.6 + lines.length * .38).toFixed(2) + "s");
      }
      renderCard(rawTo, rawOcc, rawFrom, rawMsg);

      var fall = document.getElementById("fall"), PAL = ["#D91B38", "#9E0B22", "#FFFFFF", "#FFD6E4", "#F497B6", "#FF8FA3"];
      function makePetal(x, y, sc) {
        var d = document.createElement("div"); d.className = "fp"; d.style.left = x + "px"; d.style.top = y + "px";
        d.style.background = pick(PAL); d.style.width = (11 * sc).toFixed(1) + "px"; d.style.height = (14 * sc).toFixed(1) + "px";
        fall.appendChild(d); return d;
      }
      stage.addEventListener("pointerdown", function (e) {
        for (var i = 0; i < 16; i++) {
          var d = makePetal(e.clientX, e.clientY, .5 + rnd() * .6), ang = (i / 16) * Math.PI * 2 + jit(.3), dist = 70 + rnd() * 160;
          var a = d.animate([{ transform: "translate3d(0,0,0) rotate(0deg) scale(.4)", opacity: .95 }, { transform: "translate3d(" + (Math.cos(ang) * dist).toFixed(1) + "px," + (Math.sin(ang) * dist * .8 + 100).toFixed(1) + "px,0) rotate(240deg) scale(1)", opacity: 0 }], { duration: 1200, easing: "cubic-bezier(.2,.7,.3,1)" });
          a.onfinish = function () { this.remove(); }.bind(d);
        }
      });

      var fab = document.getElementById("fab"), sheet = document.getElementById("sheet");
      var fTo = document.getElementById("f-to"), fOcc = document.getElementById("f-occ"), fMsg = document.getElementById("f-msg"), fFrom = document.getElementById("f-from"), fStyle = document.getElementById("f-style");
      fTo.value = rawTo;
      fOcc.value = rawOcc;
      fFrom.value = rawFrom;
      fMsg.value = rawMsg.split("|").join("\n");
      fStyle.value = STYLE;

      function saveCurrentToStorage() {
        var cfg = {
          to: fTo.value.trim() || DEFAULT_TO,
          occasion: fOcc.value.trim() || DEFAULT_OCCASION,
          from: fFrom.value.trim(),
          msg: fMsg.value,
          style: fStyle.value || "garden"
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch (e) {}
        return cfg;
      }

      function buildUrl() {
        var p = new URLSearchParams();
        if (fStyle.value && fStyle.value !== "garden") p.set("style", fStyle.value);
        if (fTo.value.trim()) p.set("to", fTo.value.trim());
        if (fOcc.value.trim()) p.set("occasion", fOcc.value.trim());
        if (fFrom.value.trim()) p.set("from", fFrom.value.trim());
        var m = fMsg.value.split("\n").map(function(s){return s.trim();}).filter(Boolean).slice(0,5).join("|");
        if (m) p.set("msg", m);
        var base = location.href.split("?")[0].split("#")[0];
        return base + (p.toString() ? "?" + p.toString() : "");
      }
      fab.addEventListener("click", function (e) { e.stopPropagation(); sheet.classList.add("open"); });
      document.getElementById("c-edit").addEventListener("click", function (e) { e.stopPropagation(); sheet.classList.add("open"); });
      document.getElementById("c-save").addEventListener("click", function (e) {
        e.stopPropagation();
        saveCurrentToStorage();
        try { history.replaceState({}, "", buildUrl()); } catch (err) {}
        var self = this; self.textContent = "✓ Saved!";
        setTimeout(function () { self.textContent = "✓ Save Changes"; }, 2200);
      });
      document.getElementById("fab-save").addEventListener("click", function (e) {
        e.stopPropagation();
        saveCurrentToStorage();
        try { history.replaceState({}, "", buildUrl()); } catch (err) {}
        var self = this; self.textContent = "✓ Saved!";
        setTimeout(function () { self.textContent = "Save Changes"; }, 2200);
      });
      document.getElementById("b-close").addEventListener("click", function () { sheet.classList.remove("open"); });
      sheet.addEventListener("click", function (e) { if (e.target === sheet) sheet.classList.remove("open"); });
      document.getElementById("b-copy").addEventListener("click", function () {
        saveCurrentToStorage();
        var u = buildUrl();
        if (navigator.clipboard) navigator.clipboard.writeText(u);
        this.textContent = "Copied Link!";
        var self = this; setTimeout(function(){ self.textContent = "Copy Share Link"; }, 2000);
      });
      document.getElementById("b-apply").addEventListener("click", function () {
        saveCurrentToStorage();
        location.href = buildUrl();
      });
    })();
  </script>
</body>
</html>
